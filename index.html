<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lava Jump</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');
    
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    
    .game-font {
      font-family: 'Bangers', cursive;
    }
    
    @keyframes lavaFlow {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    
    .lava {
      background: linear-gradient(90deg, #ff4500, #ff8c00, #ffd700, #ff8c00, #ff4500);
      background-size: 200% 100%;
      animation: lavaFlow 2s ease-in-out infinite;
    }
    
    .lava-bubble {
      position: absolute;
      background: radial-gradient(circle, #ffd700 0%, #ff8c00 50%, transparent 70%);
      border-radius: 50%;
      animation: bubble 1.5s ease-in-out infinite;
    }
    
    @keyframes bubble {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.8; }
      50% { transform: translateY(-10px) scale(1.2); opacity: 1; }
    }
    
    .platform {
      background: linear-gradient(180deg, #4a4a4a 0%, #2d2d2d 50%, #1a1a1a 100%);
      box-shadow: 0 4px 0 #0a0a0a, inset 0 2px 0 rgba(255,255,255,0.1);
      border-radius: 4px;
    }
    
    .player {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 50%, #15803d 100%);
      box-shadow: 0 3px 0 #14532d, inset 0 2px 0 rgba(255,255,255,0.3);
      border-radius: 4px;
    }

    .coin {
      background: radial-gradient(circle at 30% 30%, #ffd700, #ffed4e);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.8), inset -1px -1px 2px rgba(0,0,0,0.3);
      border-radius: 50%;
      animation: coinSpin 2s linear infinite;
    }

    @keyframes coinSpin {
      0%, 100% { transform: rotateY(0deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.1); }
    }

    .mobile-controls {
      display: none;
      gap: 10px;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    @media (max-width: 768px) {
      .mobile-controls {
        display: flex;
      }
      #instructions {
        display: none !important;
      }
    }

    .control-btn {
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.1s;
      touch-action: manipulation;
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .arrow-btn {
      background: linear-gradient(135deg, #3b82f6, #1e40af);
      color: white;
      width: 50px;
      height: 50px;
    }

    .jump-btn {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: white;
      width: 70px;
      height: 70px;
      font-size: 24px;
    }

    .shop-item {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 2px solid #4b5563;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .shop-item.purchased {
      opacity: 0.6;
      border-color: #22c55e;
    }

    .shop-item-info {
      flex: 1;
    }

    .shop-item-name {
      color: #fbbf24;
      font-weight: bold;
    }

    .shop-item-price {
      color: #94a3b8;
      font-size: 0.9em;
    }

    .buy-btn {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .buy-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #16a34a, #15803d);
    }

    .buy-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full bg-slate-900 overflow-hidden">
  <div id="game-container" class="relative w-full h-full overflow-hidden" style="background: linear-gradient(180deg, #0f172a 0%, #1e293b 50%, #334155 100%);"><!-- Game Title -->
   <div class="absolute top-4 left-1/2 transform -translate-x-1/2 z-20">
    <h1 id="game-title" class="game-font text-4xl md:text-5xl text-yellow-400 drop-shadow-lg" style="text-shadow: 3px 3px 0 #ff4500;">Lava Jump</h1>
   </div><!-- Score & Timer -->
   <div class="absolute top-4 left-4 z-20 bg-black/50 px-4 py-2 rounded-lg">
    <p class="game-font text-white text-xl">Score: <span id="score" class="text-yellow-400">0</span></p>
    <p class="game-font text-white text-lg">Lava Reset: <span id="timer" class="text-orange-400">30</span>s</p>
   </div><!-- Coins & Shop -->
   <div class="absolute top-20 left-4 z-20 bg-black/50 px-4 py-2 rounded-lg">
    <p class="game-font text-white text-lg">💰 Total: <span id="total-coins" class="text-yellow-400">0</span></p>
    <p class="game-font text-white text-lg">🪙 This Run: <span id="run-coins" class="text-yellow-400">0</span></p><button id="shop-btn" class="game-font text-white bg-purple-600 hover:bg-purple-700 px-3 py-1 rounded mt-2 transition-all">🛍️ Shop</button>
   </div><!-- Instructions -->
   <div id="instructions" class="absolute top-4 right-4 z-20 bg-black/50 px-4 py-2 rounded-lg">
    <p class="game-font text-white text-lg">Press <span class="text-yellow-400">↑</span> to Jump!</p>
    <p class="game-font text-sm text-gray-300">Lava rises every 5s</p>
   </div><!-- Shop Modal -->
   <div id="shop-modal" class="absolute inset-0 z-50 flex items-center justify-center bg-black/80 hidden">
    <div class="bg-gradient-to-b from-slate-800 to-slate-900 p-6 rounded-lg max-w-md w-11/12 max-h-96 overflow-y-auto">
     <h2 class="game-font text-3xl text-yellow-400 mb-4">🛍️ SHOP</h2>
     <p class="game-font text-white mb-4">💰 You have: <span id="shop-coins" class="text-yellow-400 text-xl">0</span> coins</p>
     <div id="shop-items" class="space-y-3"></div><button id="close-shop" class="game-font w-full mt-4 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded transition-all">Close Shop</button>
    </div>
   </div><!-- Game Over Screen -->
   <div id="game-over" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-black/80 hidden">
    <h2 class="game-font text-6xl text-red-500 mb-4" style="text-shadow: 3px 3px 0 #ff4500;">GAME OVER!</h2>
    <p class="game-font text-2xl text-white mb-2">Final Score: <span id="final-score" class="text-yellow-400">0</span></p>
    <p class="game-font text-xl text-white mb-4">Coins This Run: <span id="final-coins" class="text-yellow-400">0</span></p><button id="restart-btn" class="game-font text-2xl bg-gradient-to-r from-orange-500 to-yellow-500 text-white px-8 py-3 rounded-lg mt-4 hover:from-orange-600 hover:to-yellow-600 transition-all transform hover:scale-105 shadow-lg"> Play Again </button>
   </div><!-- Game Canvas -->
   <div id="game-area" class="absolute inset-0 pb-24 md:pb-0"><!-- Player -->
    <div id="player" class="player absolute w-10 h-10 z-10"></div><!-- Platforms Container -->
    <div id="platforms"></div><!-- Coins Container -->
    <div id="coins"></div><!-- Lava -->
    <div id="lava" class="lava absolute bottom-0 left-0 right-0 z-5" style="height: 50px;">
     <div class="lava-bubble" style="width: 20px; height: 20px; left: 10%; top: -10px;"></div>
     <div class="lava-bubble" style="width: 15px; height: 15px; left: 30%; top: -5px; animation-delay: 0.3s;"></div>
     <div class="lava-bubble" style="width: 25px; height: 25px; left: 50%; top: -15px; animation-delay: 0.6s;"></div>
     <div class="lava-bubble" style="width: 18px; height: 18px; left: 70%; top: -8px; animation-delay: 0.9s;"></div>
     <div class="lava-bubble" style="width: 22px; height: 22px; left: 85%; top: -12px; animation-delay: 1.2s;"></div>
    </div>
   </div><!-- Mobile Controls -->
   <div class="mobile-controls absolute bottom-0 left-0 right-0 bg-slate-800/90 z-20"><button id="left-btn" class="control-btn arrow-btn">⬅️</button> <button id="jump-btn" class="control-btn jump-btn">⬆️</button> <button id="right-btn" class="control-btn arrow-btn">➡️</button>
   </div>
  </div>
  <script>
    const defaultConfig = {
      game_title: 'Lava Jump'
    };

    // Game state
    let player, platforms, lava, gameArea, coinsContainer;
    let playerX, playerY, velocityY = 0;
    let isJumping = false;
    let score = 0;
    let totalCoins = 0;
    let runCoins = 0;
    let lavaHeight = 50;
    let lavaRiseTimer = 0;
    let resetTimer = 30;
    let gameRunning = true;
    let platformElements = [];
    let coinElements = [];
    
    // Upgrades
    let upgrades = {
      slowLava: false,
      doubleJump: false,
      morePlatforms: false,
      ninjaMode: false,
      energyDrink: false
    };
    
    const GRAVITY = 0.5;
    const JUMP_FORCE = -14;
    const PLAYER_SIZE = 40;
    const LAVA_RISE_INTERVAL = 5000;
    let LAVA_RISE_AMOUNT = 40;
    const RESET_INTERVAL = 30000;
    
    const SHOP_ITEMS = [
      { id: 'slowLava', name: '🌊 Slow Lava', cost: 50, desc: 'Lava rises half as fast' },
      { id: 'doubleJump', name: '✨ Double Jump', cost: 75, desc: 'Jump twice in the air' },
      { id: 'morePlatforms', name: '🌉 2x Platforms', cost: 100, desc: 'More platforms spawn' },
      { id: 'ninjaMode', name: '⚡ Ninja Mode', cost: 80, desc: 'Move faster' },
      { id: 'energyDrink', name: '🥤 Energy Drink', cost: 60, desc: 'Jump higher' }
    ];

    let leftPressed = false;
    let rightPressed = false;

    function initGame() {
      player = document.getElementById('player');
      platforms = document.getElementById('platforms');
      lava = document.getElementById('lava');
      gameArea = document.getElementById('game-area');
      coinsContainer = document.getElementById('coins');
      
      const areaRect = gameArea.getBoundingClientRect();
      playerX = areaRect.width / 2 - PLAYER_SIZE / 2;
      playerY = areaRect.height - 150;
      
      createPlatforms();
      createCoins();
      updatePlayerPosition();
      setupShop();
      setupMobileControls();
      
      document.addEventListener('keydown', handleKeyDown);
      document.addEventListener('keyup', handleKeyUp);
      document.getElementById('restart-btn').addEventListener('click', restartGame);
      document.getElementById('shop-btn').addEventListener('click', openShop);
      document.getElementById('close-shop').addEventListener('click', closeShop);
      
      lavaRiseTimer = setInterval(riseLava, LAVA_RISE_INTERVAL);
      setInterval(updateResetTimer, 1000);
      setInterval(gameLoop, 1000 / 60);
    }

    function setupMobileControls() {
      const leftBtn = document.getElementById('left-btn');
      const rightBtn = document.getElementById('right-btn');
      const jumpBtn = document.getElementById('jump-btn');

      leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); leftPressed = true; });
      leftBtn.addEventListener('touchend', (e) => { e.preventDefault(); leftPressed = false; });
      leftBtn.addEventListener('mousedown', () => { leftPressed = true; });
      leftBtn.addEventListener('mouseup', () => { leftPressed = false; });

      rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); rightPressed = true; });
      rightBtn.addEventListener('touchend', (e) => { e.preventDefault(); rightPressed = false; });
      rightBtn.addEventListener('mousedown', () => { rightPressed = true; });
      rightBtn.addEventListener('mouseup', () => { rightPressed = false; });

      jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (gameRunning) jump(); });
      jumpBtn.addEventListener('click', (e) => { e.preventDefault(); if (gameRunning) jump(); });
    }

    function setupShop() {
      const shopItemsDiv = document.getElementById('shop-items');
      shopItemsDiv.innerHTML = '';

      SHOP_ITEMS.forEach(item => {
        const isPurchased = upgrades[item.id];
        const itemEl = document.createElement('div');
        itemEl.className = `shop-item ${isPurchased ? 'purchased' : ''}`;
        
        const infoEl = document.createElement('div');
        infoEl.className = 'shop-item-info';
        infoEl.innerHTML = `
          <div class="shop-item-name">${item.name}</div>
          <div class="shop-item-price">${item.desc}</div>
        `;
        
        const btnEl = document.createElement('button');
        btnEl.className = 'buy-btn game-font';
        btnEl.textContent = isPurchased ? '✓' : `💰 ${item.cost}`;
        btnEl.disabled = isPurchased || totalCoins < item.cost;
        
        btnEl.addEventListener('click', () => buyUpgrade(item));
        
        itemEl.appendChild(infoEl);
        itemEl.appendChild(btnEl);
        shopItemsDiv.appendChild(itemEl);
      });
    }

    function buyUpgrade(item) {
      if (totalCoins >= item.cost && !upgrades[item.id]) {
        totalCoins -= item.cost;
        upgrades[item.id] = true;
        
        if (item.id === 'slowLava') LAVA_RISE_AMOUNT = 20;
        if (item.id === 'energyDrink') {
          // Increase jump height
        }
        
        updateCoinDisplay();
        setupShop();
      }
    }

    function createCoins() {
      coinsContainer.innerHTML = '';
      coinElements = [];
      
      const areaRect = gameArea.getBoundingClientRect();
      const coinCount = upgrades.morePlatforms ? 20 : 15;
      
      for (let i = 0; i < coinCount; i++) {
        const coin = document.createElement('div');
        coin.className = 'coin absolute';
        const x = Math.random() * (areaRect.width - 20);
        const y = Math.random() * (areaRect.height - 200) + 100;
        
        coin.style.left = x + 'px';
        coin.style.top = y + 'px';
        coin.style.width = '20px';
        coin.style.height = '20px';
        
        coinsContainer.appendChild(coin);
        coinElements.push({
          element: coin,
          x: x,
          y: y,
          width: 20,
          height: 20,
          collected: false
        });
      }
    }

    function checkCoinCollision() {
      const playerLeft = playerX;
      const playerRight = playerX + PLAYER_SIZE;
      const playerTop = playerY;
      const playerBottom = playerY + PLAYER_SIZE;
      
      coinElements.forEach(coin => {
        if (!coin.collected && 
            playerRight > coin.x && 
            playerLeft < coin.x + coin.width &&
            playerBottom > coin.y && 
            playerTop < coin.y + coin.height) {
          coin.collected = true;
          coin.element.remove();
          runCoins++;
          totalCoins++;
          updateCoinDisplay();
        }
      });
    }

    function updateCoinDisplay() {
      document.getElementById('total-coins').textContent = totalCoins;
      document.getElementById('run-coins').textContent = runCoins;
      document.getElementById('shop-coins').textContent = totalCoins;
    }

    function openShop() {
      if (gameRunning) {
        gameRunning = false;
        document.getElementById('shop-modal').classList.remove('hidden');
        setupShop();
      }
    }

    function closeShop() {
      gameRunning = true;
      document.getElementById('shop-modal').classList.add('hidden');
    }
    
    function createPlatforms() {
      platforms.innerHTML = '';
      platformElements = [];
      
      const areaRect = gameArea.getBoundingClientRect();
      const baseConfigs = [
        { x: areaRect.width / 2 - 75, y: areaRect.height - 100, width: 150 },
        { x: 50, y: areaRect.height - 200, width: 120 },
        { x: areaRect.width - 170, y: areaRect.height - 200, width: 120 },
        { x: areaRect.width / 2 - 60, y: areaRect.height - 300, width: 120 },
        { x: 30, y: areaRect.height - 400, width: 100 },
        { x: areaRect.width - 130, y: areaRect.height - 400, width: 100 },
        { x: areaRect.width / 2 - 70, y: areaRect.height - 500, width: 140 },
        { x: 80, y: areaRect.height - 600, width: 110 },
        { x: areaRect.width - 190, y: areaRect.height - 600, width: 110 },
        { x: areaRect.width / 2 - 50, y: areaRect.height - 700, width: 100 },
        { x: 150, y: areaRect.height - 350, width: 90 },
        { x: areaRect.width - 240, y: areaRect.height - 350, width: 90 },
        { x: areaRect.width / 2 - 80, y: areaRect.height - 450, width: 160 },
        { x: 60, y: areaRect.height - 550, width: 100 },
        { x: areaRect.width - 160, y: areaRect.height - 550, width: 100 },
        { x: areaRect.width / 2 - 45, y: areaRect.height - 650, width: 90 },
      ];
      
      let platformConfigs = baseConfigs;
      if (upgrades.morePlatforms) {
        platformConfigs = platformConfigs.concat([
          { x: 200, y: areaRect.height - 250, width: 100 },
          { x: areaRect.width - 300, y: areaRect.height - 250, width: 100 },
          { x: areaRect.width / 2 - 60, y: areaRect.height - 350, width: 120 },
        ]);
      }
      
      platformConfigs.forEach(config => {
        const platform = document.createElement('div');
        platform.className = 'platform absolute';
        platform.style.left = config.x + 'px';
        platform.style.top = config.y + 'px';
        platform.style.width = config.width + 'px';
        platform.style.height = '20px';
        platforms.appendChild(platform);
        platformElements.push({
          element: platform,
          x: config.x,
          y: config.y,
          width: config.width,
          height: 20
        });
      });
    }
    
    function handleKeyDown(e) {
      if (!gameRunning) return;
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        jump();
      } else if (e.key === 'ArrowLeft') {
        leftPressed = true;
      } else if (e.key === 'ArrowRight') {
        rightPressed = true;
      }
    }

    function handleKeyUp(e) {
      if (e.key === 'ArrowLeft') leftPressed = false;
      if (e.key === 'ArrowRight') rightPressed = false;
    }
    
    function jump() {
      if (!isJumping || isOnPlatform()) {
        velocityY = upgrades.energyDrink ? JUMP_FORCE * 1.3 : JUMP_FORCE;
        isJumping = true;
      } else if (upgrades.doubleJump && isJumping) {
        velocityY = upgrades.energyDrink ? JUMP_FORCE * 1.3 : JUMP_FORCE;
      }
    }
    
    function isOnPlatform() {
      const playerBottom = playerY + PLAYER_SIZE;
      const playerLeft = playerX;
      const playerRight = playerX + PLAYER_SIZE;
      
      for (let platform of platformElements) {
        if (playerBottom >= platform.y && 
            playerBottom <= platform.y + 10 &&
            playerRight > platform.x && 
            playerLeft < platform.x + platform.width &&
            velocityY >= 0) {
          return true;
        }
      }
      return false;
    }
    
    function checkPlatformCollision() {
      const playerBottom = playerY + PLAYER_SIZE;
      const playerLeft = playerX;
      const playerRight = playerX + PLAYER_SIZE;
      
      for (let platform of platformElements) {
        if (playerBottom >= platform.y && 
            playerBottom <= platform.y + 15 &&
            playerRight > platform.x && 
            playerLeft < platform.x + platform.width &&
            velocityY > 0) {
          playerY = platform.y - PLAYER_SIZE;
          velocityY = 0;
          isJumping = false;
          return true;
        }
      }
      return false;
    }
    
    function updatePlayerPosition() {
      player.style.left = playerX + 'px';
      player.style.top = playerY + 'px';
    }
    
    function riseLava() {
      if (!gameRunning) return;
      lavaHeight += LAVA_RISE_AMOUNT;
      lava.style.height = lavaHeight + 'px';
      score += 10;
      document.getElementById('score').textContent = score;
    }
    
    function updateResetTimer() {
      if (!gameRunning) return;
      resetTimer--;
      document.getElementById('timer').textContent = resetTimer;
      
      if (resetTimer <= 0) {
        lavaHeight = 50;
        lava.style.height = lavaHeight + 'px';
        resetTimer = 30;
        score += 50;
        document.getElementById('score').textContent = score;
      }
    }
    
    function checkLavaCollision() {
      const areaRect = gameArea.getBoundingClientRect();
      const lavaTop = areaRect.height - lavaHeight;
      
      if (playerY + PLAYER_SIZE > lavaTop) {
        gameOver();
      }
    }
    
    function gameOver() {
      gameRunning = false;
      clearInterval(lavaRiseTimer);
      document.getElementById('final-score').textContent = score;
      document.getElementById('final-coins').textContent = runCoins;
      document.getElementById('game-over').classList.remove('hidden');
    }
    
    function restartGame() {
      gameRunning = true;
      score = 0;
      runCoins = 0;
      lavaHeight = 50;
      resetTimer = 30;
      velocityY = 0;
      isJumping = false;
      
      const areaRect = gameArea.getBoundingClientRect();
      playerX = areaRect.width / 2 - PLAYER_SIZE / 2;
      playerY = areaRect.height - 150;
      
      lava.style.height = lavaHeight + 'px';
      document.getElementById('score').textContent = score;
      document.getElementById('timer').textContent = resetTimer;
      updateCoinDisplay();
      document.getElementById('game-over').classList.add('hidden');
      
      createPlatforms();
      createCoins();
      
      lavaRiseTimer = setInterval(riseLava, LAVA_RISE_INTERVAL);
      
      requestAnimationFrame(gameLoop);
    }
    
    function gameLoop() {
      if (!gameRunning) return;
      
      velocityY += GRAVITY;
      playerY += velocityY;
      
      const areaRect = gameArea.getBoundingClientRect();
      const moveSpeed = upgrades.ninjaMode ? 20 : 15;
      
      if (leftPressed) playerX -= moveSpeed;
      if (rightPressed) playerX += moveSpeed;
      
      if (playerX < 0) playerX = 0;
      if (playerX > areaRect.width - PLAYER_SIZE) playerX = areaRect.width - PLAYER_SIZE;
      
      checkPlatformCollision();
      checkCoinCollision();
      
      const groundLevel = areaRect.height - lavaHeight - PLAYER_SIZE;
      if (playerY > groundLevel) {
        checkLavaCollision();
      }
      
      updatePlayerPosition();
    }
    
    // Element SDK initialization
    window.elementSdk.init({
      defaultConfig,
      onConfigChange: async (config) => {
        const titleEl = document.getElementById('game-title');
        titleEl.textContent = config.game_title || defaultConfig.game_title;
      },
      mapToCapabilities: (config) => ({
        recolorables: [],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      }),
      mapToEditPanelValues: (config) => new Map([
        ['game_title', config.game_title || defaultConfig.game_title]
      ])
    });
    
    // Initialize game when DOM is ready

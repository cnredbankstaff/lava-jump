<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lava Jump</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');
    
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    
    .game-font {
      font-family: 'Bangers', cursive;
    }
    
    @keyframes lavaFlow {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    
    .lava {
      background: linear-gradient(90deg, #ff4500, #ff8c00, #ffd700, #ff8c00, #ff4500);
      background-size: 200% 100%;
      animation: lavaFlow 2s ease-in-out infinite;
    }
    
    .lava-bubble {
      position: absolute;
      background: radial-gradient(circle, #ffd700 0%, #ff8c00 50%, transparent 70%);
      border-radius: 50%;
      animation: bubble 1.5s ease-in-out infinite;
    }
    
    @keyframes bubble {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.8; }
      50% { transform: translateY(-10px) scale(1.2); opacity: 1; }
    }
    
    @keyframes coinSpin {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }
    
    .coin {
      width: 30px;
      height: 30px;
      background: radial-gradient(circle at 30% 30%, #ffd700, #ffed4e);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.8), inset -2px -2px 5px rgba(0,0,0,0.3);
      animation: coinSpin 2s linear infinite;
    }
    
    .platform {
      background: linear-gradient(180deg, #4a4a4a 0%, #2d2d2d 50%, #1a1a1a 100%);
      box-shadow: 0 4px 0 #0a0a0a, inset 0 2px 0 rgba(255,255,255,0.1);
      border-radius: 4px;
    }
    
    .player {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 50%, #15803d 100%);
      box-shadow: 0 3px 0 #14532d, inset 0 2px 0 rgba(255,255,255,0.3);
      border-radius: 4px;
    }
    
    .shop-item {
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      border: 2px solid #a78bfa;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .shop-item button {
      background: #10b981;
      padding: 6px 12px;
      border-radius: 4px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .shop-item button:hover:not(:disabled) {
      background: #059669;
      transform: scale(1.05);
    }
    
    .shop-item button:disabled {
      background: #6b7280;
      cursor: not-allowed;
      opacity: 0.6;
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full bg-slate-900 overflow-hidden">
  <div id="game-container" class="relative w-full h-full overflow-hidden" style="background: linear-gradient(180deg, #0f172a 0%, #1e293b 50%, #334155 100%);"><!-- Game Title -->
   <div class="absolute top-4 left-1/2 transform -translate-x-1/2 z-20">
    <h1 id="game-title" class="game-font text-4xl md:text-5xl text-yellow-400 drop-shadow-lg" style="text-shadow: 3px 3px 0 #ff4500;">Lava Jump</h1>
   </div><!-- Score & Timer -->
   <div class="absolute top-4 left-4 z-20 bg-black/50 px-4 py-2 rounded-lg">
    <p class="game-font text-white text-xl">Score: <span id="score" class="text-yellow-400">0</span></p>
    <p class="game-font text-white text-lg">🪙 Coins: <span id="coins" class="text-yellow-400">0</span></p>
    <p class="game-font text-white text-lg">Lava Reset: <span id="timer" class="text-orange-400">30</span>s</p>
   </div><!-- Shop Button --> <button id="shop-btn" class="absolute top-4 right-4 z-20 game-font text-lg bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg transition-all transform hover:scale-105 shadow-lg">🛍️ Shop</button> <!-- Shop Panel -->
   <div id="shop-panel" class="absolute inset-0 z-40 bg-black/80 flex items-center justify-center hidden">
    <div class="bg-gradient-to-b from-purple-900 to-purple-800 p-8 rounded-lg max-w-md w-11/12 max-h-96 overflow-y-auto">
     <div class="flex justify-between items-center mb-6">
      <h2 class="game-font text-3xl text-yellow-400">Shop</h2><button id="close-shop" class="game-font text-2xl text-white hover:text-yellow-400">✕</button>
     </div>
     <div id="shop-items" class="space-y-3"><!-- Shop items will be generated here -->
     </div>
    </div>
   </div><!-- Instructions -->
   <div id="instructions" class="absolute bottom-4 left-4 z-20 bg-black/50 px-4 py-2 rounded-lg">
    <p class="game-font text-white text-lg">Press <span class="text-yellow-400">↑</span> to Jump!</p>
    <p class="game-font text-sm text-gray-300">← → to Move | Collect coins!</p>
   </div><!-- Game Over Screen -->
   <div id="game-over" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-black/80 hidden">
    <h2 class="game-font text-6xl text-red-500 mb-4" style="text-shadow: 3px 3px 0 #ff4500;">GAME OVER!</h2>
    <p class="game-font text-2xl text-white mb-2">Final Score: <span id="final-score" class="text-yellow-400">0</span></p>
    <p class="game-font text-xl text-white mb-4">Coins Earned: <span id="final-coins" class="text-yellow-400">0</span></p><button id="restart-btn" class="game-font text-2xl bg-gradient-to-r from-orange-500 to-yellow-500 text-white px-8 py-3 rounded-lg mt-4 hover:from-orange-600 hover:to-yellow-600 transition-all transform hover:scale-105 shadow-lg">Play Again</button>
   </div><!-- Game Canvas -->
   <div id="game-area" class="absolute inset-0"><!-- Player -->
    <div id="player" class="player absolute w-10 h-10 z-10"></div><!-- Coins Container -->
    <div id="coins-container"></div><!-- Platforms Container -->
    <div id="platforms"></div><!-- Lava -->
    <div id="lava" class="lava absolute bottom-0 left-0 right-0 z-5" style="height: 50px;">
     <div class="lava-bubble" style="width: 20px; height: 20px; left: 10%; top: -10px;"></div>
     <div class="lava-bubble" style="width: 15px; height: 15px; left: 30%; top: -5px; animation-delay: 0.3s;"></div>
     <div class="lava-bubble" style="width: 25px; height: 25px; left: 50%; top: -15px; animation-delay: 0.6s;"></div>
     <div class="lava-bubble" style="width: 18px; height: 18px; left: 70%; top: -8px; animation-delay: 0.9s;"></div>
     <div class="lava-bubble" style="width: 22px; height: 22px; left: 85%; top: -12px; animation-delay: 1.2s;"></div>
    </div>
   </div>
  </div>
  <script>
    const defaultConfig = {
      game_title: 'Lava Jump'
    };

    // Game state
    let player, platforms, lava, gameArea, coinsContainer;
    let playerX, playerY, velocityY = 0;
    let isJumping = false;
    let score = 0;
    let coins = 0;
    let lavaHeight = 50;
    let lavaRiseTimer = 0;
    let resetTimer = 30;
    let gameRunning = true;
    let platformElements = [];
    let coinElements = [];
    
    // Upgrades
    let upgrades = {
      slowLava: { purchased: false, cost: 50, name: 'Slow Lava', description: 'Lava rises slower' },
      doubleJump: { purchased: false, cost: 75, name: 'Double Jump', description: 'Jump in mid-air' },
      doublePlatforms: { purchased: false, cost: 100, name: '2x Platforms', description: 'More platforms!' },
      ninjaMode: { purchased: false, cost: 80, name: 'Ninja Mode', description: 'Move faster' },
      energyDrink: { purchased: false, cost: 60, name: 'Energy Drink', description: 'Jump higher' }
    };
    
    const GRAVITY = 0.5;
    const JUMP_FORCE = -14;
    const PLAYER_SIZE = 40;
    let LAVA_RISE_INTERVAL = 5000;
    let LAVA_RISE_AMOUNT = 40;
    const RESET_INTERVAL = 30000;
    let PLAYER_SPEED = 15;
    let JUMP_FORCE_CURRENT = JUMP_FORCE;
    
    function initGame() {
      player = document.getElementById('player');
      platforms = document.getElementById('platforms');
      lava = document.getElementById('lava');
      gameArea = document.getElementById('game-area');
      coinsContainer = document.getElementById('coins-container');
      
      const areaRect = gameArea.getBoundingClientRect();
      playerX = areaRect.width / 2 - PLAYER_SIZE / 2;
      playerY = areaRect.height - 150;
      
      // Apply purchased upgrades
      if (upgrades.slowLava.purchased) {
        LAVA_RISE_INTERVAL = 8000;
      }
      if (upgrades.energyDrink.purchased) {
        JUMP_FORCE_CURRENT = JUMP_FORCE - 3;
      }
      
      createPlatforms();
      createCoins();
      updatePlayerPosition();
      
      document.addEventListener('keydown', handleKeyDown);
      document.getElementById('restart-btn').addEventListener('click', restartGame);
      document.getElementById('shop-btn').addEventListener('click', openShop);
      document.getElementById('close-shop').addEventListener('click', closeShop);
      
      lavaRiseTimer = setInterval(riseLava, LAVA_RISE_INTERVAL);
      setInterval(updateResetTimer, 1000);
      
      requestAnimationFrame(gameLoop);
    }
    
    function createCoins() {
      coinsContainer.innerHTML = '';
      coinElements = [];
      
      const areaRect = gameArea.getBoundingClientRect();
      const coinPositions = [
        { x: 100, y: areaRect.height - 180 },
        { x: areaRect.width - 130, y: areaRect.height - 180 },
        { x: areaRect.width / 2, y: areaRect.height - 280 },
        { x: 180, y: areaRect.height - 380 },
        { x: areaRect.width - 200, y: areaRect.height - 380 },
        { x: areaRect.width / 2 - 80, y: areaRect.height - 480 },
        { x: 120, y: areaRect.height - 580 },
        { x: areaRect.width - 150, y: areaRect.height - 580 },
      ];
      
      coinPositions.forEach((pos, index) => {
        const coinDiv = document.createElement('div');
        coinDiv.className = 'coin absolute';
        coinDiv.style.left = pos.x + 'px';
        coinDiv.style.top = pos.y + 'px';
        coinDiv.dataset.coinId = index;
        coinsContainer.appendChild(coinDiv);
        coinElements.push({
          element: coinDiv,
          x: pos.x,
          y: pos.y,
          collected: false,
          id: index
        });
      });
    }
    
    function createPlatforms() {
      platforms.innerHTML = '';
      platformElements = [];
      
      const areaRect = gameArea.getBoundingClientRect();
      let platformConfigs = [
        { x: areaRect.width / 2 - 75, y: areaRect.height - 100, width: 150 },
        { x: 50, y: areaRect.height - 200, width: 120 },
        { x: areaRect.width - 170, y: areaRect.height - 200, width: 120 },
        { x: areaRect.width / 2 - 60, y: areaRect.height - 300, width: 120 },
        { x: 30, y: areaRect.height - 400, width: 100 },
        { x: areaRect.width - 130, y: areaRect.height - 400, width: 100 },
        { x: areaRect.width / 2 - 70, y: areaRect.height - 500, width: 140 },
        { x: 80, y: areaRect.height - 600, width: 110 },
        { x: areaRect.width - 190, y: areaRect.height - 600, width: 110 },
        { x: areaRect.width / 2 - 50, y: areaRect.height - 700, width: 100 },
        { x: 150, y: areaRect.height - 350, width: 90 },
        { x: areaRect.width - 240, y: areaRect.height - 350, width: 90 },
        { x: areaRect.width / 2 - 80, y: areaRect.height - 450, width: 160 },
        { x: 60, y: areaRect.height - 550, width: 100 },
        { x: areaRect.width - 160, y: areaRect.height - 550, width: 100 },
        { x: areaRect.width / 2 - 45, y: areaRect.height - 650, width: 90 },
      ];
      
      if (upgrades.doublePlatforms.purchased) {
        platformConfigs = platformConfigs.concat(platformConfigs.map(p => ({
          x: p.x + 40,
          y: p.y - 75,
          width: p.width
        })));
      }
      
      platformConfigs.forEach(config => {
        const platform = document.createElement('div');
        platform.className = 'platform absolute';
        platform.style.left = config.x + 'px';
        platform.style.top = config.y + 'px';
        platform.style.width = config.width + 'px';
        platform.style.height = '20px';
        platforms.appendChild(platform);
        platformElements.push({
          element: platform,
          x: config.x,
          y: config.y,
          width: config.width,
          height: 20
        });
      });
    }
    
    function handleKeyDown(e) {
      if (e.key === 'ArrowUp' && gameRunning) {
        jump();
      } else if (e.key === 'ArrowLeft' && gameRunning) {
        playerX -= PLAYER_SPEED;
      } else if (e.key === 'ArrowRight' && gameRunning) {
        playerX += PLAYER_SPEED;
      }
    }
    
    function jump() {
      if (!isJumping || isOnPlatform()) {
        velocityY = JUMP_FORCE_CURRENT;
        isJumping = true;
      } else if (upgrades.doubleJump.purchased && isJumping) {
        velocityY = JUMP_FORCE_CURRENT;
      }
    }
    
    function isOnPlatform() {
      const playerBottom = playerY + PLAYER_SIZE;
      const playerLeft = playerX;
      const playerRight = playerX + PLAYER_SIZE;
      
      for (let platform of platformElements) {
        if (playerBottom >= platform.y && 
            playerBottom <= platform.y + 10 &&
            playerRight > platform.x && 
            playerLeft < platform.x + platform.width &&
            velocityY >= 0) {
          return true;
        }
      }
      return false;
    }
    
    function checkPlatformCollision() {
      const playerBottom = playerY + PLAYER_SIZE;
      const playerLeft = playerX;
      const playerRight = playerX + PLAYER_SIZE;
      
      for (let platform of platformElements) {
        if (playerBottom >= platform.y && 
            playerBottom <= platform.y + 15 &&
            playerRight > platform.x && 
            playerLeft < platform.x + platform.width &&
            velocityY > 0) {
          playerY = platform.y - PLAYER_SIZE;
          velocityY = 0;
          isJumping = false;
          return true;
        }
      }
      return false;
    }
    
    function checkCoinCollision() {
      const playerCenterX = playerX + PLAYER_SIZE / 2;
      const playerCenterY = playerY + PLAYER_SIZE / 2;
      
      coinElements.forEach(coin => {
        if (!coin.collected) {
          const coinCenterX = coin.x + 15;
          const coinCenterY = coin.y + 15;
          const distance = Math.sqrt(Math.pow(playerCenterX - coinCenterX, 2) + Math.pow(playerCenterY - coinCenterY, 2));
          
          if (distance < 30) {
            coin.collected = true;
            coin.element.remove();
            coins++;
            score += 5;
            document.getElementById('coins').textContent = coins;
            document.getElementById('score').textContent = score;
          }
        }
      });
    }
    
    function updatePlayerPosition() {
      const areaRect = gameArea.getBoundingClientRect();
      if (playerX < 0) playerX = 0;
      if (playerX > areaRect.width - PLAYER_SIZE) playerX = areaRect.width - PLAYER_SIZE;
      
      player.style.left = playerX + 'px';
      player.style.top = playerY + 'px';
    }
    
    function riseLava() {
      if (!gameRunning) return;
      lavaHeight += LAVA_RISE_AMOUNT;
      lava.style.height = lavaHeight + 'px';
      score += 10;
      document.getElementById('score').textContent = score;
    }
    
    function updateResetTimer() {
      if (!gameRunning) return;
      resetTimer--;
      document.getElementById('timer').textContent = resetTimer;
      
      if (resetTimer <= 0) {
        lavaHeight = 50;
        lava.style.height = lavaHeight + 'px';
        resetTimer = 30;
        score += 50;
        document.getElementById('score').textContent = score;
      }
    }
    
    function checkLavaCollision() {
      const areaRect = gameArea.getBoundingClientRect();
      const lavaTop = areaRect.height - lavaHeight;
      
      if (playerY + PLAYER_SIZE > lavaTop) {
        gameOver();
      }
    }
    
    function gameOver() {
      gameRunning = false;
      clearInterval(lavaRiseTimer);
      document.getElementById('final-score').textContent = score;
      document.getElementById('final-coins').textContent = coins;
      document.getElementById('game-over').classList.remove('hidden');
    }
    
    function restartGame() {
      gameRunning = true;
      score = 0;
      coins = 0;
      lavaHeight = 50;
      resetTimer = 30;
      velocityY = 0;
      isJumping = false;
      LAVA_RISE_INTERVAL = upgrades.slowLava.purchased ? 8000 : 5000;
      JUMP_FORCE_CURRENT = upgrades.energyDrink.purchased ? JUMP_FORCE - 3 : JUMP_FORCE;
      PLAYER_SPEED = upgrades.ninjaMode.purchased ? 25 : 15;
      
      const areaRect = gameArea.getBoundingClientRect();
      playerX = areaRect.width / 2 - PLAYER_SIZE / 2;
      playerY = areaRect.height - 150;
      
      lava.style.height = lavaHeight + 'px';
      document.getElementById('score').textContent = score;
      document.getElementById('coins').textContent = coins;
      document.getElementById('timer').textContent = resetTimer;
      document.getElementById('game-over').classList.add('hidden');
      
      createPlatforms();
      createCoins();
      
      lavaRiseTimer = setInterval(riseLava, LAVA_RISE_INTERVAL);
      
      requestAnimationFrame(gameLoop);
    }
    
    function gameLoop() {
      if (!gameRunning) return;
      
      velocityY += GRAVITY;
      playerY += velocityY;
      
      const areaRect = gameArea.getBoundingClientRect();
      
      checkPlatformCollision();
      checkCoinCollision();
      
      const groundLevel = areaRect.height - lavaHeight - PLAYER_SIZE;
      if (playerY > groundLevel) {
        checkLavaCollision();
      }
      
      updatePlayerPosition();
      
      requestAnimationFrame(gameLoop);
    }
    
    function openShop() {
      document.getElementById('shop-panel').classList.remove('hidden');
      renderShopItems();
    }
    
    function closeShop() {
      document.getElementById('shop-panel').classList.add('hidden');
    }
    
    function renderShopItems() {
      const shopItems = document.getElementById('shop-items');
      shopItems.innerHTML = '';
      
      Object.entries(upgrades).forEach(([key, upgrade]) => {
        const item = document.createElement('div');
        item.className = 'shop-item';
        item.innerHTML = `
          <div>
            <p class="game-font text-white text-lg">${upgrade.name}</p>
            <p class="text-sm text-gray-200">${upgrade.description}</p>
            <p class="game-font text-yellow-400 text-lg">Cost: ${upgrade.cost} 🪙</p>
          </div>
          <button class="shop-purchase-btn" data-upgrade="${key}" ${upgrade.purchased ? 'disabled' : ''}>
            ${upgrade.purchased ? '✓' : 'Buy'}
          </button>
        `;
        shopItems.appendChild(item);
      });
      
      document.querySelectorAll('.shop-purchase-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const upgradeKey = e.target.dataset.upgrade;
          purchaseUpgrade(upgradeKey);
        });
      });
    }
    
    function purchaseUpgrade(upgradeKey) {
      const upgrade = upgrades[upgradeKey];
      if (coins >= upgrade.cost && !upgrade.purchased) {
        coins -= upgrade.cost;
        upgrade.purchased = true;
        document.getElementById('coins').textContent = coins;
        renderShopItems();
      }
    }
    
    // Element SDK initialization
    window.elementSdk.init({
      defaultConfig,
      onConfigChange: async (config) => {
        const titleEl = document.getElementById('game-title');
        titleEl.textContent = config.game_title || defaultConfig.game_title;
      },
      mapToCapabilities: (config) => ({
        recolorables: [],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      }),
      mapToEditPanelValues: (config) => new Map([
        ['game_title', config.game_title || defaultConfig.game_title]
      ])
    });
    
    // Initialize game when DOM is ready
    document.addEventListener('DOMContentLoaded', initGame);
  </script>

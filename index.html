<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lava Jump</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');
    
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    
    .game-font {
      font-family: 'Bangers', cursive;
    }
    
    @keyframes lavaFlow {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    
    .lava {
      background: linear-gradient(90deg, #ff4500, #ff8c00, #ffd700, #ff8c00, #ff4500);
      background-size: 200% 100%;
      animation: lavaFlow 2s ease-in-out infinite;
    }
    
    .lava-bubble {
      position: absolute;
      background: radial-gradient(circle, #ffd700 0%, #ff8c00 50%, transparent 70%);
      border-radius: 50%;
      animation: bubble 1.5s ease-in-out infinite;
    }
    
    @keyframes bubble {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.8; }
      50% { transform: translateY(-10px) scale(1.2); opacity: 1; }
    }
    
    .platform {
      background: linear-gradient(180deg, #4a4a4a 0%, #2d2d2d 50%, #1a1a1a 100%);
      box-shadow: 0 4px 0 #0a0a0a, inset 0 2px 0 rgba(255,255,255,0.1);
      border-radius: 4px;
    }
    
    .player {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 50%, #15803d 100%);
      box-shadow: 0 3px 0 #14532d, inset 0 2px 0 rgba(255,255,255,0.3);
      border-radius: 4px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .coin {
      background: radial-gradient(circle at 30% 30%, #ffd700, #ffed4e);
      box-shadow: inset -2px -2px 4px rgba(0,0,0,0.3), 2px 2px 4px rgba(0,0,0,0.5);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    .asteroid {
      background: radial-gradient(circle at 30% 30%, #8b8680, #5a5a5a);
      box-shadow: inset -2px -2px 4px rgba(0,0,0,0.5);
      border-radius: 50%;
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full bg-slate-900 overflow-hidden">
  <div id="game-container" class="relative w-full h-full overflow-hidden" style="background: linear-gradient(180deg, #0f172a 0%, #1e293b 50%, #334155 100%);"><!-- Game Title -->
   <div class="absolute top-4 left-1/2 transform -translate-x-1/2 z-20">
    <h1 id="game-title" class="game-font text-4xl md:text-5xl text-yellow-400 drop-shadow-lg" style="text-shadow: 3px 3px 0 #ff4500;">Lava Jump</h1>
   </div><!-- Score & Timer -->
   <div class="absolute top-4 left-4 z-20 bg-black/50 px-4 py-2 rounded-lg">
    <p class="game-font text-white text-xl">Score: <span id="score" class="text-yellow-400">0</span></p>
    <p class="game-font text-white text-lg">💰 <span id="coin-count" class="text-yellow-400">0</span></p>
    <p class="game-font text-white text-lg">Lava Reset: <span id="timer" class="text-orange-400">30</span>s</p>
   </div><!-- Instructions & Shop -->
   <div id="instructions" class="absolute top-4 right-4 z-20 bg-black/50 px-4 py-2 rounded-lg">
    <p class="game-font text-white text-lg">Press <span class="text-yellow-400">↑</span> to Jump!</p>
    <p class="game-font text-sm text-gray-300">Lava rises every 5s</p>
   </div><!-- Shop Button --> <button id="shop-btn" class="absolute top-24 right-4 z-20 game-font bg-gradient-to-r from-purple-600 to-pink-600 text-white px-4 py-2 rounded-lg hover:from-purple-700 hover:to-pink-700 transition-all transform hover:scale-105 shadow-lg text-lg"> 🛒 Shop </button> <!-- Shop Panel -->
   <div id="shop-panel" class="absolute inset-0 z-40 bg-black/80 hidden flex items-center justify-center">
    <div class="bg-gradient-to-b from-slate-800 to-slate-900 p-8 rounded-lg max-w-md w-11/12 border-4 border-purple-500">
     <h2 class="game-font text-3xl text-yellow-400 mb-4 text-center">SHOP</h2>
     <p class="game-font text-white text-center mb-6">Coins: <span id="shop-coins" class="text-yellow-400 text-2xl">0</span></p>
     <div class="space-y-3 mb-6"><!-- Double Jump --> <button class="shop-item w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white p-3 rounded-lg transition-all transform hover:scale-105" data-upgrade="double-jump" data-cost="50"> <p class="game-font text-lg">Double Jump</p><p class="text-sm">Cost: <span class="font-bold">50 coins</span></p></button> <!-- Slow Lava --> <button class="shop-item w-full bg-gradient-to-r from-cyan-600 to-cyan-500 hover:from-cyan-700 hover:to-cyan-600 text-white p-3 rounded-lg transition-all transform hover:scale-105" data-upgrade="slow-lava" data-cost="75"> <p class="game-font text-lg">Slow Lava (30s)</p><p class="text-sm">Cost: <span class="font-bold">75 coins</span></p></button> <!-- Shield --> <button class="shop-item w-full bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-700 hover:to-amber-600 text-white p-3 rounded-lg transition-all transform hover:scale-105" data-upgrade="shield" data-cost="100"> <p class="game-font text-lg">Shield (1 hit)</p><p class="text-sm">Cost: <span class="font-bold">100 coins</span></p></button> <!-- Bigger Player --> <button class="shop-item w-full bg-gradient-to-r from-green-600 to-green-500 hover:from-green-700 hover:to-green-600 text-white p-3 rounded-lg transition-all transform hover:scale-105" data-upgrade="bigger-player" data-cost="60"> <p class="game-font text-lg">Bigger Player</p><p class="text-sm">Cost: <span class="font-bold">60 coins</span></p></button>
     </div><button id="close-shop-btn" class="w-full game-font text-xl bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition-all"> Close </button>
    </div>
   </div><!-- Game Over Screen -->
   <div id="game-over" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-black/80 hidden">
    <h2 class="game-font text-6xl text-red-500 mb-4" style="text-shadow: 3px 3px 0 #ff4500;">GAME OVER!</h2>
    <p class="game-font text-2xl text-white mb-2">Final Score: <span id="final-score" class="text-yellow-400">0</span></p>
    <p class="game-font text-xl text-white mb-4">Coins Earned: <span id="final-coins" class="text-yellow-400">0</span></p><button id="restart-btn" class="game-font text-2xl bg-gradient-to-r from-orange-500 to-yellow-500 text-white px-8 py-3 rounded-lg mt-4 hover:from-orange-600 hover:to-yellow-600 transition-all transform hover:scale-105 shadow-lg"> Play Again </button>
   </div><!-- Game Canvas -->
   <div id="game-area" class="absolute inset-0"><!-- Player -->
    <div id="player" class="player absolute w-10 h-10 z-10"></div><!-- Platforms Container -->
    <div id="platforms"></div><!-- Coins Container -->
    <div id="coins"></div><!-- Asteroids Container -->
    <div id="asteroids"></div><!-- Lava -->
    <div id="lava" class="lava absolute bottom-0 left-0 right-0 z-5" style="height: 50px;">
     <div class="lava-bubble" style="width: 20px; height: 20px; left: 10%; top: -10px;"></div>
     <div class="lava-bubble" style="width: 15px; height: 15px; left: 30%; top: -5px; animation-delay: 0.3s;"></div>
     <div class="lava-bubble" style="width: 25px; height: 25px; left: 50%; top: -15px; animation-delay: 0.6s;"></div>
     <div class="lava-bubble" style="width: 18px; height: 18px; left: 70%; top: -8px; animation-delay: 0.9s;"></div>
     <div class="lava-bubble" style="width: 22px; height: 22px; left: 85%; top: -12px; animation-delay: 1.2s;"></div>
    </div>
   </div>
  </div>
  <script>
    const defaultConfig = {
      game_title: 'Lava Jump'
    };

    // Game state
    let player, platforms, lava, gameArea, coinsContainer, asteroidsContainer;
    let playerX, playerY, velocityY = 0;
    let isJumping = false;
    let score = 0;
    let coins = 0;
    let lavaHeight = 50;
    let lavaRiseTimer = 0;
    let resetTimer = 30;
    let gameRunning = true;
    let platformElements = [];
    let coinElements = [];
    let asteroidElements = [];
    let asteroidSpawnTimer = null;
    
    // Upgrades
    let doubleJump = false;
    let doubleJumpUsed = false;
    let slowLavaActive = false;
    let shield = 0;
    let playerSize = 40;
    
    const GRAVITY = 0.5;
    const JUMP_FORCE = -14;
    const LAVA_RISE_INTERVAL = 5000;
    const LAVA_RISE_AMOUNT = 40;
    const RESET_INTERVAL = 30000;
    const ASTEROID_SPAWN_INTERVAL = 60000;
    
    function initGame() {
      player = document.getElementById('player');
      platforms = document.getElementById('platforms');
      lava = document.getElementById('lava');
      gameArea = document.getElementById('game-area');
      coinsContainer = document.getElementById('coins');
      asteroidsContainer = document.getElementById('asteroids');
      
      const areaRect = gameArea.getBoundingClientRect();
      playerX = areaRect.width / 2 - playerSize / 2;
      playerY = areaRect.height - 150;
      
      createPlatforms();
      createCoins();
      updatePlayerPosition();
      
      document.addEventListener('keydown', handleKeyDown);
      document.getElementById('restart-btn').addEventListener('click', restartGame);
      document.getElementById('shop-btn').addEventListener('click', openShop);
      document.getElementById('close-shop-btn').addEventListener('click', closeShop);
      
      document.querySelectorAll('.shop-item').forEach(btn => {
        btn.addEventListener('click', purchaseUpgrade);
      });
      
      lavaRiseTimer = setInterval(riseLava, LAVA_RISE_INTERVAL);
      setInterval(updateResetTimer, 1000);
      asteroidSpawnTimer = setInterval(spawnAsteroid, ASTEROID_SPAWN_INTERVAL);
      
      requestAnimationFrame(gameLoop);
    }
    
    function createPlatforms() {
      platforms.innerHTML = '';
      platformElements = [];
      
      const areaRect = gameArea.getBoundingClientRect();
      const platformConfigs = [
        { x: areaRect.width / 2 - 75, y: areaRect.height - 100, width: 150 },
        { x: 50, y: areaRect.height - 200, width: 120 },
        { x: areaRect.width - 170, y: areaRect.height - 200, width: 120 },
        { x: areaRect.width / 2 - 60, y: areaRect.height - 300, width: 120 },
        { x: 30, y: areaRect.height - 400, width: 100 },
        { x: areaRect.width - 130, y: areaRect.height - 400, width: 100 },
        { x: areaRect.width / 2 - 70, y: areaRect.height - 500, width: 140 },
        { x: 80, y: areaRect.height - 600, width: 110 },
        { x: areaRect.width - 190, y: areaRect.height - 600, width: 110 },
        { x: areaRect.width / 2 - 50, y: areaRect.height - 700, width: 100 },
        { x: 150, y: areaRect.height - 350, width: 90 },
        { x: areaRect.width - 240, y: areaRect.height - 350, width: 90 },
        { x: areaRect.width / 2 - 80, y: areaRect.height - 450, width: 160 },
        { x: 60, y: areaRect.height - 550, width: 100 },
        { x: areaRect.width - 160, y: areaRect.height - 550, width: 100 },
        { x: areaRect.width / 2 - 45, y: areaRect.height - 650, width: 90 },
      ];
      
      platformConfigs.forEach(config => {
        const platform = document.createElement('div');
        platform.className = 'platform absolute';
        platform.style.left = config.x + 'px';
        platform.style.top = config.y + 'px';
        platform.style.width = config.width + 'px';
        platform.style.height = '20px';
        platforms.appendChild(platform);
        platformElements.push({
          element: platform,
          x: config.x,
          y: config.y,
          width: config.width,
          height: 20,
          timeOnPlatform: 0,
          visible: true
        });
      });
    }
    
    function createCoins() {
      coinsContainer.innerHTML = '';
      coinElements = [];
      
      const areaRect = gameArea.getBoundingClientRect();
      const numCoins = 8;
      
      for (let i = 0; i < numCoins; i++) {
        const coin = document.createElement('div');
        coin.className = 'coin absolute';
        const x = Math.random() * (areaRect.width - 30);
        const y = Math.random() * (areaRect.height - 300) + 100;
        coin.style.left = x + 'px';
        coin.style.top = y + 'px';
        coin.style.width = '30px';
        coin.style.height = '30px';
        coinsContainer.appendChild(coin);
        
        coinElements.push({
          element: coin,
          x: x,
          y: y,
          width: 30,
          height: 30,
          collected: false
        });
      }
    }
    
    function spawnAsteroid() {
      if (!gameRunning) return;
      
      const areaRect = gameArea.getBoundingClientRect();
      const asteroid = document.createElement('div');
      asteroid.className = 'asteroid absolute';
      const x = Math.random() * (areaRect.width - 30);
      asteroid.style.left = x + 'px';
      asteroid.style.top = '-30px';
      asteroid.style.width = '30px';
      asteroid.style.height = '30px';
      asteroidsContainer.appendChild(asteroid);
      
      asteroidElements.push({
        element: asteroid,
        x: x,
        y: -30,
        width: 30,
        height: 30,
        velocityY: 3
      });
    }
    
    function handleKeyDown(e) {
      if (e.key === 'ArrowUp' && gameRunning) {
        jump();
      } else if (e.key === 'ArrowLeft' && gameRunning) {
        playerX -= 15;
      } else if (e.key === 'ArrowRight' && gameRunning) {
        playerX += 15;
      }
    }
    
    function jump() {
      if (!isJumping || isOnPlatform()) {
        velocityY = JUMP_FORCE;
        isJumping = true;
        doubleJumpUsed = false;
      } else if (doubleJump && !doubleJumpUsed) {
        velocityY = JUMP_FORCE;
        doubleJumpUsed = true;
      }
    }
    
    function isOnPlatform() {
      const playerBottom = playerY + playerSize;
      const playerLeft = playerX;
      const playerRight = playerX + playerSize;
      
      for (let platform of platformElements) {
        if (platform.visible && playerBottom >= platform.y && 
            playerBottom <= platform.y + 10 &&
            playerRight > platform.x && 
            playerLeft < platform.x + platform.width &&
            velocityY >= 0) {
          platform.timeOnPlatform += 1;
          if (platform.timeOnPlatform > 1200) { // 20 seconds
            platform.visible = false;
            platform.element.style.opacity = '0';
            setTimeout(() => {
              platform.visible = true;
              platform.element.style.opacity = '1';
              platform.timeOnPlatform = 0;
            }, 10000); // 10 seconds
          }
          return true;
        }
      }
      return false;
    }
    
    function checkPlatformCollision() {
      const playerBottom = playerY + playerSize;
      const playerLeft = playerX;
      const playerRight = playerX + playerSize;
      
      for (let platform of platformElements) {
        if (platform.visible && playerBottom >= platform.y && 
            playerBottom <= platform.y + 15 &&
            playerRight > platform.x && 
            playerLeft < platform.x + platform.width &&
            velocityY > 0) {
          playerY = platform.y - playerSize;
          velocityY = 0;
          isJumping = false;
          platform.timeOnPlatform = 0;
          return true;
        }
      }
      return false;
    }
    
    function checkCoinCollision() {
      const playerLeft = playerX;
      const playerRight = playerX + playerSize;
      const playerTop = playerY;
      const playerBottom = playerY + playerSize;
      
      coinElements.forEach(coin => {
        if (!coin.collected && 
            playerRight > coin.x && 
            playerLeft < coin.x + coin.width &&
            playerBottom > coin.y && 
            playerTop < coin.y + coin.height) {
          coin.collected = true;
          coin.element.remove();
          coins += 1;
          document.getElementById('coin-count').textContent = coins;
        }
      });
    }
    
    function checkAsteroidCollision() {
      const playerLeft = playerX;
      const playerRight = playerX + playerSize;
      const playerTop = playerY;
      const playerBottom = playerY + playerSize;
      
      asteroidElements.forEach(asteroid => {
        if (playerRight > asteroid.x && 
            playerLeft < asteroid.x + asteroid.width &&
            playerBottom > asteroid.y && 
            playerTop < asteroid.y + asteroid.height) {
          if (shield > 0) {
            shield--;
            asteroid.element.remove();
            asteroidElements = asteroidElements.filter(a => a !== asteroid);
          } else {
            gameOver();
          }
        }
      });
    }
    
    function updateAsteroids() {
      asteroidElements = asteroidElements.filter(asteroid => {
        asteroid.y += asteroid.velocityY;
        asteroid.element.style.top = asteroid.y + 'px';
        
        if (asteroid.y > gameArea.getBoundingClientRect().height) {
          asteroid.element.remove();
          return false;
        }
        return true;
      });
    }
    
    function updatePlayerPosition() {
      player.style.left = playerX + 'px';
      player.style.top = playerY + 'px';
      player.style.width = playerSize + 'px';
      player.style.height = playerSize + 'px';
    }
    
    function riseLava() {
      if (!gameRunning) return;
      if (!slowLavaActive) {
        lavaHeight += LAVA_RISE_AMOUNT;
      }
      lava.style.height = lavaHeight + 'px';
      score += 10;
      document.getElementById('score').textContent = score;
    }
    
    function updateResetTimer() {
      if (!gameRunning) return;
      resetTimer--;
      document.getElementById('timer').textContent = resetTimer;
      
      if (resetTimer <= 0) {
        lavaHeight = 50;
        lava.style.height = lavaHeight + 'px';
        resetTimer = 30;
        score += 50;
        document.getElementById('score').textContent = score;
        slowLavaActive = false;
      }
    }
    
    function checkLavaCollision() {
      const areaRect = gameArea.getBoundingClientRect();
      const lavaTop = areaRect.height - lavaHeight;
      
      if (playerY + playerSize > lavaTop) {
        gameOver();
      }
    }
    
    function gameOver() {
      gameRunning = false;
      clearInterval(lavaRiseTimer);
      clearInterval(asteroidSpawnTimer);
      document.getElementById('final-score').textContent = score;
      document.getElementById('final-coins').textContent = coins;
      document.getElementById('game-over').classList.remove('hidden');
    }
    
    function restartGame() {
      gameRunning = true;
      score = 0;
      lavaHeight = 50;
      resetTimer = 30;
      velocityY = 0;
      isJumping = false;
      doubleJumpUsed = false;
      slowLavaActive = false;
      
      const areaRect = gameArea.getBoundingClientRect();
      playerX = areaRect.width / 2 - playerSize / 2;
      playerY = areaRect.height - 150;
      
      lava.style.height = lavaHeight + 'px';
      document.getElementById('score').textContent = score;
      document.getElementById('coin-count').textContent = coins;
      document.getElementById('timer').textContent = resetTimer;
      document.getElementById('game-over').classList.add('hidden');
      
      asteroidsContainer.innerHTML = '';
      asteroidElements = [];
      
      createPlatforms();
      createCoins();
      
      lavaRiseTimer = setInterval(riseLava, LAVA_RISE_INTERVAL);
      asteroidSpawnTimer = setInterval(spawnAsteroid, ASTEROID_SPAWN_INTERVAL);
      
      requestAnimationFrame(gameLoop);
    }
    
    function gameLoop() {
      if (!gameRunning) return;
      
      velocityY += GRAVITY;
      playerY += velocityY;
      
      const areaRect = gameArea.getBoundingClientRect();
      
      if (playerX < 0) playerX = 0;
      if (playerX > areaRect.width - playerSize) playerX = areaRect.width - playerSize;
      
      checkPlatformCollision();
      checkCoinCollision();
      checkAsteroidCollision();
      updateAsteroids();
      
      const groundLevel = areaRect.height - lavaHeight - playerSize;
      if (playerY > groundLevel) {
        checkLavaCollision();
      }
      
      updatePlayerPosition();
      checkLavaCollision();
      
      requestAnimationFrame(gameLoop);
    }
    
    function openShop() {
      document.getElementById('shop-panel').classList.remove('hidden');
      document.getElementById('shop-coins').textContent = coins;
    }
    
    function closeShop() {
      document.getElementById('shop-panel').classList.add('hidden');
    }
    
    function purchaseUpgrade(e) {
      const btn = e.currentTarget;
      const upgrade = btn.dataset.upgrade;
      const cost = parseInt(btn.dataset.cost);
      
      if (coins < cost) {
        alert('Not enough coins!');
        return;
      }
      
      coins -= cost;
      document.getElementById('shop-coins').textContent = coins;
      document.getElementById('coin-count').textContent = coins;
      
      switch(upgrade) {
        case 'double-jump':
          doubleJump = true;
          btn.disabled = true;
          btn.textContent = '✓ Purchased';
          break;
        case 'slow-lava':
          slowLavaActive = true;
          setTimeout(() => { slowLavaActive = false; }, 30000);
          break;
        case 'shield':
          shield += 1;
          break;
        case 'bigger-player':
          playerSize = 60;
          break;
      }
    }
    
    // Element SDK initialization
    window.elementSdk.init({
      defaultConfig,
      onConfigChange: async (config) => {
        const titleEl = document.getElementById('game-title');
        titleEl.textContent = config.game_title || defaultConfig.game_title;
      },
      mapToCapabilities: (config) => ({
        recolorables: [],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      }),
      mapToEditPanelValues: (config) => new Map([
        ['game_title', config.game_title || defaultConfig.game_title]
      ])
    });
    
    // Initialize game when DOM is ready
    document.addEventListener('DOMContentLoaded', initGame);
  </script>
